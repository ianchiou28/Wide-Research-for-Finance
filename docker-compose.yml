version: '3.8'

services:
  finance-app:
    build: .
    ports:
      - "8080:5000"  # 避免占用宿主机80端口
    environment:
      - TZ=Asia/Shanghai
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - FLASK_DEBUG=false
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - LOG_LEVEL=INFO
      # 代理（可选）：在服务器已配置代理时取消注释
      # - HTTP_PROXY=${HTTP_PROXY}
      # - HTTPS_PROXY=${HTTPS_PROXY}
      # - NO_PROXY=localhost,127.0.0.1,nginx,finance-app,finance-collector,*.local,*.svc,172.16.0.0/12,10.0.0.0/8
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/latest"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    
  finance-collector:
    build: .
    command: python main.py
    environment:
      - TZ=Asia/Shanghai
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DOCKER_ENV=True
      - LOG_LEVEL=INFO
      # 代理（可选）：在服务器已配置代理时取消注释
      # - HTTP_PROXY=${HTTP_PROXY}
      # - HTTPS_PROXY=${HTTPS_PROXY}
      # - NO_PROXY=localhost,127.0.0.1,nginx,finance-app,finance-collector,*.local,*.svc,172.16.0.0/12,10.0.0.0/8
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0)"]
      interval: 300s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    depends_on:
      finance-app:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - finance-app
    restart: unless-stopped

  # HTTPS 证书自动续期（可选，需先手动申请证书）
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"